<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Multi-Language Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="prism-bg"></div>
    <div class="container">
        <h1>📖 Multi-Language Dictionary</h1>
        
        <div class="controls-bar">
            <select id="languageSelect" class="language-select" aria-label="Select dictionary language">
                <option value="MALAYALAM">English - Malayalam</option>
                <option value="BODO">English - Bodo</option>
                <option value="MAITHILI">English - Maithili</option>
            </select>
            <button onclick="init()" class="theme-button refresh-btn" aria-label="Refresh">🔄 Refresh</button>
            <button id="adminLoginBtn" class="theme-button admin-btn" aria-label="Admin login" aria-expanded="false">🔑 Admin</button>
            <button id="themeToggle" class="theme-button" aria-label="Toggle dark/light theme">☀️ Theme</button>
            <button id="contactButton" class="contact-button" aria-label="Contact" aria-expanded="false">📞 Contact</button>
        </div>
        
        <div id="searchArea">
            <input type="text" id="searchInput" placeholder="🔍 Search English word..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search English word">
        </div>

        <p id="statusMessage" class="info" role="status" aria-live="polite">Ready!</p>

        <div id="adminPanel" class="description-box" style="display:none;">
            <h3 id="adminPanelTitle">🛠 Admin Access</h3>
            <div id="loginForm">
                <input type="email" id="adminUser" placeholder="Admin Email" autocomplete="username">
                <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
                <button onclick="performLogin()" class="save-btn">Login</button>
            </div>
            <div id="entryForm" style="display:none;">
                <input type="text" id="newEnglish" placeholder="English Word">
                <input type="text" id="newTranslation" placeholder="Native Translation">
                <input type="text" id="newType" placeholder="Grammar Tag (e.g. n, v)">
                <button onclick="saveNewWord()" class="save-btn">Save to Database</button>
            </div>
            <button onclick="logout()" class="back-button" style="background:#666; margin-top:10px; width:100%;">Close / Logout</button>
        </div>

        <div id="contactArea" class="description-box" style="display:none;">
            <h3>📬 Contact</h3>
            <div class="contact-links">
                <a href="mailto:yaduk883@gmail.com" class="contact-link-button email-button">📧 Email</a>
                <a href="https://github.com/yaduk883" target="_blank" rel="noopener noreferrer" class="contact-link-button github-button">🐙 GitHub</a>
            </div>
        </div>

        <div id="descriptionArea" class="description-box" style="display:none;">
            <h3 id="descriptionTitle"></h3>
            <div id="definitionText"></div>
            <button id="backButton" class="back-button">← Back to Results</button>
        </div>

        <div id="bookTableContainer" style="display:none;">
            <table id="bookTable">
                <thead>
                    <tr>
                        <th scope="col">English Word</th>
                        <th scope="col">Translation</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script type="module" src="prism.js"></script>
</body>
</html>
