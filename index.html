<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 English-Malayalam Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="prism-bg"></div>
    <div class="container">
        <h1>📖 English-Malayalam Dictionary</h1>
        
        <div class="controls-bar">
            <!-- Dropdown മാറ്റി സ്റ്റാറ്റിക് ബാഡ്ജ് ആക്കി -->
            <button class="language-select" style="pointer-events: none; cursor: default;">Eng ⇄ Mal</button>
            <button onclick="init()" class="theme-button refresh-btn">🔄 Refresh</button>
            <button id="adminLoginBtn" class="theme-button admin-btn">🔑 Admin</button>
            <button id="themeToggle" class="theme-button">☀️ Theme</button>
            <button id="contactButton" class="contact-button">📞 Contact</button>
        </div>
        
        <div id="searchArea">
            <!-- Placeholder മാറ്റി -->
            <input type="text" id="searchInput" placeholder="🔍 Search English or Malayalam word...">
        </div>

        <p id="statusMessage" class="info">Ready!</p>

        <div id="adminPanel" class="description-box" style="display:none;">
            <h3 id="adminPanelTitle">🛠 Admin Access</h3>
            <div id="loginForm">
                <input type="email" id="adminUser" placeholder="Admin Email">
                <input type="password" id="adminPass" placeholder="Password">
                <button onclick="performLogin()" class="save-btn">Login</button>
            </div>
            <div id="entryForm" style="display:none;">
                <input type="text" id="newEnglish" placeholder="English Word">
                <input type="text" id="newTranslation" placeholder="Malayalam Translation">
                <input type="text" id="newType" placeholder="Grammar Tag (e.g. n, v)">
                <button onclick="saveNewWord()" class="save-btn">Save to Database</button>
            </div>
            <button onclick="logout()" class="back-button" style="background:#666; margin-top:10px; width:100%;">Close / Logout</button>
        </div>

        <div id="contactArea" class="description-box" style="display:none;">
            <h3>📬 Contact</h3>
            <div class="contact-links">
                <a href="mailto:yaduk883@gmail.com" class="contact-link-button email-button">📧 Email</a>
                <a href="https://github.com/yaduk883" target="_blank" class="contact-link-button github-button">🐙 GitHub</a>
            </div>
        </div>

        <div id="descriptionArea" class="description-box" style="display:none;">
            <h3 id="descriptionTitle"></h3>
            <div id="definitionText"></div>
            <button id="backButton" class="back-button">← Back to Results</button>
        </div>

        <div id="bookTableContainer" style="display:none;">
            <table id="bookTable">
                <thead>
                    <tr>
                        <th>English Word</th>
                        <th>Malayalam Translation</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script type="module" src="prism.js"></script>
</body>
</html>
