<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Guide — Lethologica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="prism-bg"></div>

    <svg style="display:none" aria-hidden="true">
        <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5C4 4.67 4.67 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/>
            <path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/>
        </symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.2 14.6A8.5 8.5 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8Z"/>
        </symbol>
        <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="15" r="4"/>
            <path d="M11 12 19.5 3.5M16 6l2.5 2.5M13.2 8.8l2.3 2.3"/>
        </symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/>
            <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            <path d="M6.5 7 7.3 19a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8L17.5 7"/>
            <path d="M10 11v6M14 11v6"/>
        </symbol>
    </svg>

    <main class="container" style="max-width: 860px;">
        <div class="gr-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><svg width="26" height="26"><use href="#icon-book"/></svg></span>
                <div>
                    <h1 class="gr-title">Grammar Guide</h1>
                    <p class="gr-subtitle">Parts of speech, articles, and all 12 English tenses</p>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <button id="adminLoginBtn" class="btn-icon" type="button" title="Admin" aria-label="Admin access" aria-expanded="false">
                    <svg width="18" height="18"><use href="#icon-key"/></svg>
                </button>
                <button id="themeToggle" class="btn-icon theme-toggle" type="button" title="Toggle theme" aria-label="Toggle dark and light theme">
                    <svg class="icon-sun" width="18" height="18"><use href="#icon-sun"/></svg>
                    <svg class="icon-moon" width="18" height="18"><use href="#icon-moon"/></svg>
                </button>
                <a href="index.html" class="gr-back">
                    <svg width="16" height="16"><use href="#icon-arrow-left"/></svg> Back to dictionary
                </a>
            </div>
        </div>

        <!-- ===================== ADMIN PANEL ===================== -->
        <section id="adminPanel" class="collapsible">
            <div class="collapsible-inner">
                <div class="panel-surface">
                    <h3 class="panel-title">Admin access</h3>
                    <div id="loginForm">
                        <label class="text-field">
                            <span>Email</span>
                            <input type="email" id="adminUser" placeholder="you@example.com" autocomplete="username">
                        </label>
                        <label class="text-field">
                            <span>Password</span>
                            <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password">
                        </label>
                        <button id="loginBtn" class="btn-primary btn-block" type="button">Log in</button>
                    </div>

                    <div id="entryForm" style="display:none;">
                        <div class="gr-admin-tabs">
                            <button class="gr-admin-tab active" data-tab="topics" type="button">Topics</button>
                            <button class="gr-admin-tab" data-tab="rules" type="button">Rules</button>
                            <button class="gr-admin-tab" data-tab="examples" type="button">Examples</button>
                        </div>

                        <!-- ---- TOPICS TAB ---- -->
                        <div id="tab-topics" class="gr-admin-panel">
                            <div class="manage-search">
                                <label class="text-field">
                                    <span>Find an existing topic</span>
                                    <input type="text" id="topicSearchInput" placeholder="Search by title or slug…">
                                </label>
                                <button id="topicSearchBtn" class="btn-ghost btn-block" type="button">Find topics</button>
                                <div id="topicResults" class="manage-results"></div>
                            </div>

                            <h4 id="topicFormHeading" class="panel-subtitle">Add a new topic</h4>
                            <label class="text-field">
                                <span>Slug (unique, no spaces)</span>
                                <input type="text" id="topicSlug" placeholder="e.g. modal_verbs">
                            </label>
                            <label class="text-field">
                                <span>Category</span>
                                <select id="topicCategory">
                                    <option value="parts_of_speech">Parts of speech</option>
                                    <option value="articles">Articles</option>
                                    <option value="tenses">Tenses</option>
                                    <option value="sentence_structure">Sentence structure</option>
                                    <option value="other">Other</option>
                                </select>
                            </label>
                            <label class="text-field">
                                <span>Title</span>
                                <input type="text" id="topicTitle" placeholder="e.g. Modal Verbs">
                            </label>
                            <label class="text-field">
                                <span>Short description</span>
                                <textarea id="topicDescription" rows="2" placeholder="One or two sentences introducing this topic"></textarea>
                            </label>
                            <label class="text-field">
                                <span>Formula / structure (optional)</span>
                                <input type="text" id="topicFormula" placeholder="e.g. Subject + modal + base verb">
                            </label>
                            <label class="text-field">
                                <span>Sort order</span>
                                <input type="number" id="topicSortOrder" value="0">
                            </label>
                            <button id="saveTopicBtn" class="btn-primary btn-block" type="button">Save topic</button>
                            <button id="cancelTopicBtn" class="btn-ghost btn-block" type="button" style="display:none;">Cancel edit</button>
                        </div>

                        <!-- ---- RULES TAB ---- -->
                        <div id="tab-rules" class="gr-admin-panel" style="display:none;">
                            <label class="text-field">
                                <span>Topic</span>
                                <select id="ruleTopicSelect"></select>
                            </label>

                            <div class="manage-search">
                                <button id="ruleListBtn" class="btn-ghost btn-block" type="button">List rules for this topic</button>
                                <div id="ruleResults" class="manage-results"></div>
                            </div>

                            <h4 id="ruleFormHeading" class="panel-subtitle">Add a new rule</h4>
                            <label class="text-field">
                                <span>Rule number</span>
                                <input type="number" id="ruleNumber" value="1" min="1">
                            </label>
                            <label class="text-field">
                                <span>Rule title</span>
                                <input type="text" id="ruleTitle" placeholder="e.g. Habits and routines">
                            </label>
                            <label class="text-field">
                                <span>Rule text</span>
                                <textarea id="ruleText" rows="2" placeholder="The rule itself, in full sentences"></textarea>
                            </label>
                            <label class="text-field">
                                <span>Notes (optional)</span>
                                <textarea id="ruleNotes" rows="2" placeholder="A tip, caveat, or extra detail"></textarea>
                            </label>
                            <label class="text-field">
                                <span>Sort order</span>
                                <input type="number" id="ruleSortOrder" value="1">
                            </label>
                            <button id="saveRuleBtn" class="btn-primary btn-block" type="button">Save rule</button>
                            <button id="cancelRuleBtn" class="btn-ghost btn-block" type="button" style="display:none;">Cancel edit</button>
                        </div>

                        <!-- ---- EXAMPLES TAB ---- -->
                        <div id="tab-examples" class="gr-admin-panel" style="display:none;">
                            <label class="text-field">
                                <span>Topic</span>
                                <select id="exampleTopicSelect"></select>
                            </label>
                            <label class="text-field">
                                <span>Rule</span>
                                <select id="exampleRuleSelect"></select>
                            </label>

                            <div class="manage-search">
                                <button id="exampleListBtn" class="btn-ghost btn-block" type="button">List examples for this rule</button>
                                <div id="exampleResults" class="manage-results"></div>
                            </div>

                            <h4 id="exampleFormHeading" class="panel-subtitle">Add a new example</h4>
                            <label class="text-field">
                                <span>Type</span>
                                <select id="exampleType">
                                    <option value="affirmative">Affirmative</option>
                                    <option value="negative">Negative</option>
                                    <option value="question">Question</option>
                                    <option value="example">General example</option>
                                    <option value="correct">Correct</option>
                                    <option value="incorrect">Incorrect</option>
                                    <option value="note">Note</option>
                                </select>
                            </label>
                            <label class="text-field">
                                <span>Sentence</span>
                                <input type="text" id="exampleSentence" placeholder="e.g. She writes a letter every day.">
                            </label>
                            <label class="text-field">
                                <span>Explanation (optional)</span>
                                <input type="text" id="exampleExplanation" placeholder="Why this example works">
                            </label>
                            <label class="text-field">
                                <span>Sort order</span>
                                <input type="number" id="exampleSortOrder" value="1">
                            </label>
                            <button id="saveExampleBtn" class="btn-primary btn-block" type="button">Save example</button>
                            <button id="cancelExampleBtn" class="btn-ghost btn-block" type="button" style="display:none;">Cancel edit</button>
                        </div>
                    </div>

                    <button id="logoutBtn" class="btn-ghost btn-block panel-close-btn" type="button">Close &amp; log out</button>
                </div>
            </div>
        </section>

        <!-- ===================== PUBLIC CONTENT ===================== -->
        <nav id="grammarTOC" class="gr-toc" aria-label="Guide sections"></nav>

        <div id="grammarContent">
            <p class="gr-loading"><span class="spinner" aria-hidden="true"></span> Loading grammar…</p>
        </div>

        <a href="index.html" class="btn-ghost gr-back" style="display:inline-flex; margin-top: 8px;">
            <svg width="16" height="16"><use href="#icon-arrow-left"/></svg> Back to dictionary
        </a>
    </main>

    <script>
        if (localStorage.getItem('dict_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('dict_theme', isDark ? 'dark' : 'light');
        });
    </script>

    <script src="grammar-db.js"></script>
</body>
</html>
